name: Nightly smoke test

# Museum APIs rot silently — the Rijksmuseum endpoint this server was built on
# started answering 410 Gone with no announcement, and nothing noticed until a
# user hit it. This exercises every provider against the live APIs each night.

on:
  schedule:
    # 06:00 UTC — outside peak hours for the museums we query.
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - ".github/workflows/smoke.yml"

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run smoke test
        id: smoke
        continue-on-error: true
        env:
          # Optional: set these repo secrets to include the key-gated sources in
          # the run. Without one, that source reports as skipped, not failed.
          HARVARD_API_KEY: ${{ secrets.HARVARD_API_KEY }}
          # Must be a real api.data.gov key — DEMO_KEY allows only 10 requests
          # per hour and would make the nightly run flap.
          SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
          TEPAPA_API_KEY: ${{ secrets.TEPAPA_API_KEY }}
        run: npm run smoke

      - name: Report failure
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          # Passed as env rather than interpolated into the script body: the
          # report contains artwork titles straight from the museum APIs, and
          # `${` or a backtick in a title would otherwise break out into code.
          REPORT: ${{ steps.smoke.outputs.report }}
          FAILED: ${{ steps.smoke.outputs.failed }}
        with:
          script: |
            const report = process.env.REPORT || '(no report captured)';
            const failed = process.env.FAILED || 'unknown';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const label = 'smoke-failure';
            const body = [
              `Nightly smoke test failed for: **${failed}**`,
              '',
              '```',
              report,
              '```',
              '',
              `[Full run log](${runUrl})`,
            ].join('\n');

            // Reuse an open issue so a source that stays down doesn't file a
            // fresh issue every single night.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Still failing as of ${new Date().toISOString().slice(0, 10)}.\n\n${body}`,
              });
              core.info(`Commented on existing issue #${open[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Smoke test failing: ${failed}`,
                body,
                labels: [label],
              });
              core.info(`Opened issue #${created.number}`);
            }

      - name: Fail the job if the smoke test failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
